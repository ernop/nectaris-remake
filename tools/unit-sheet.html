<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nectaris — complete native unit roster</title>
<style>
 :root { color-scheme:dark; font-family:system-ui,sans-serif; background:#111218; color:#e4e6dc; }
 * { box-sizing:border-box; }
 body { margin:0; padding:24px; }
 main { max-width:1120px; margin:auto; }
 h1 { font-size:25px; margin:0 0 8px; }
 p { color:#a8abb4; line-height:1.5; margin:0 0 16px; }
 a { color:#91c7ef; }
 .controls { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; margin:20px 0; }
 label { display:flex; align-items:center; gap:8px; }
 select { font:inherit; background:#252a34; color:inherit; padding:5px; border:1px solid #454e5d; }
 #roster { display:grid; grid-template-columns:repeat(auto-fit,minmax(248px,1fr)); gap:12px; }
 article { border:1px solid #353740; padding:14px; background:#191b23; }
 h2 { font-size:16px; margin:0 0 4px; }
 .description { font-size:12px; min-height:36px; margin-bottom:8px; }
 .states { display:flex; justify-content:space-between; gap:4px; }
 figure { margin:0; width:48px; }
 .tile { width:48px; height:32px; background:var(--ground,#482f36); clip-path:polygon(0 50%,33.333% 0,66.667% 0,100% 50%,66.667% 100%,33.333% 100%); }
 canvas { display:block; width:32px; height:32px; margin:auto; image-rendering:pixelated; }
 .frames canvas { outline:1px solid #f2cb58; outline-offset:-1px; }
 figcaption { text-align:center; color:#a8abb4; font-size:10px; margin-top:6px; }
 .links { margin-top:24px; }
</style>
</head>
<body><main>
<h1>23 units · native 32 × 32</h1>
<p>Compare icon sets at their actual 32 × 32 size. Blue faces right; green faces left. Every icon uses the game's renderer, centered within a flattened hex.</p>
<div class="controls">
 <label>Art set <select id="icon-set"></select></label>
 <label>Ground <select id="ground"><option value="#482f36">Wasteland</option><option value="#ab8b8d">Plains</option><option value="#311d27">Valley</option></select></label>
 <label><input id="frames" type="checkbox"> Frame guides</label>
 <label><input id="silhouette" type="checkbox"> Silhouettes</label>
 <a href="art-pilot.html">Try units on the map</a>
</div>
<section id="roster" aria-label="Complete unit roster"></section>
<p id="set-source"></p>
<p class="links"><a id="sheet-link" href="../art/units/output/units-native.png">Native contact sheet</a> · <a href="../index.html">Game</a> · <a href="../editor.html">Editor</a></p>
</main>
<script src="../js/hex.js"></script>
<script src="../js/data-terrain.js"></script>
<script src="../js/data-units.js"></script>
<script src="../js/combat.js"></script>
<script src="../js/data-unit-art.js"></script>
<script src="../js/data-unit-art-legacy.js"></script>
<script src="../js/unit-icon-sets.js"></script>
<script src="../js/legacy-terrain.js"></script>
<script src="../js/render.js"></script>
<script>
(() => {
 RENDER.setStyle('pixel');
 const roster=document.getElementById('roster'),setSelect=document.getElementById('icon-set');
 RENDER.getIconSets().forEach(pack=>{const option=document.createElement('option');option.value=pack.id;option.textContent=pack.label;setSelect.append(option);});
 function render(){
 const pack=RENDER.getIconSetData(RENDER.getIconSet());setSelect.value=pack.id;roster.replaceChildren();
 document.getElementById('sheet-link').href=pack.sheet;
 const source=document.getElementById('set-source');source.replaceChildren();
 source.textContent=pack.id==='legacy'?'Legacy is adapted from a JPEG chart; faction colors and opposite facing are derived. ':pack.description;
 if(pack.source){const a=document.createElement('a');a.href=pack.source;a.textContent='Source: ユニットデータ';source.append(a);}
 Object.keys(UNIT_TYPES).forEach(id=>{
  const article=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),states=document.createElement('div');
  h.textContent=UNIT_TYPES[id].name;p.className='description';p.textContent=pack.art.descriptions[id];states.className='states';
  [{name:'Union',player:0},{name:'Xenon',player:1},{name:'Attack',player:0,opts:{attacking:true}},{name:'Spent',player:0,opts:{spent:true}}].forEach(state=>{
   const f=document.createElement('figure'),tile=document.createElement('div'),c=document.createElement('canvas'),caption=document.createElement('figcaption');
   tile.className='tile';c.width=c.height=32;c.setAttribute('aria-label',UNIT_TYPES[id].name+' / '+state.name);caption.textContent=state.name;
   RENDER.drawUnitIcon(c,{typeId:id,type:UNIT_TYPES[id],player:state.player},state.opts);
   tile.append(c);f.append(tile,caption);states.append(f);
  });
  article.append(h,p,states);roster.append(article);
 });
 roster.querySelectorAll('canvas').forEach(c=>c.style.filter=document.getElementById('silhouette').checked?'brightness(0)':'none');
 }
 setSelect.onchange=()=>RENDER.setIconSet(setSelect.value);
 RENDER.onIconSetChange(render);render();
 document.getElementById('ground').onchange=e=>roster.style.setProperty('--ground',e.target.value);
 document.getElementById('frames').onchange=e=>roster.classList.toggle('frames',e.target.checked);
 document.getElementById('silhouette').onchange=e=>roster.querySelectorAll('canvas').forEach(c=>c.style.filter=e.target.checked?'brightness(0)':'none');
})();
</script>
</body></html>
