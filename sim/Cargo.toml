[package]
name = "nectaris-sim"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "nectaris-sim"
description = "Fast Nectaris rules and bots, locked to the JavaScript game by test/fixtures/sim-corpus.json.gz"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
