<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Board playback regression checks</title>
<style>body{margin:0;background:#111;color:#fff;font:14px system-ui}header{padding:8px}button{font:inherit}#results{margin:4px;max-height:150px;overflow:auto}iframe{width:100%;height:720px;border:0}</style></head>
<body><header><button id="run">Run board playback checks</button> <button id="hover">Check unit hover stars</button> <strong id="status">Ready</strong><ol id="results"></ol></header>
<iframe id="match" src="../index.html" title="Test battlefield"></iframe>
<script>
"use strict";
var frame=document.getElementById("match"),ui,checks=0;
function check(condition,message){if(!condition)throw new Error(message);checks++;console.info("PASS: "+message);var li=document.createElement("li");li.textContent="PASS: "+message;document.getElementById("results").appendChild(li);}
function wait(ms){return new Promise(function(resolve){setTimeout(resolve,ms);});}
function bounds(el){var r=el.getBoundingClientRect();return [r.x,r.y,r.width,r.height].join();}
function setup(){
  var w=frame.contentWindow,d=w.document;
  if(ui)ui.destroy();
  var dialog=d.getElementById("profile-dialog");if(dialog.open)dialog.close();
  d.getElementById("menu-screen").classList.add("hidden");d.getElementById("game-screen").classList.remove("hidden");
  var game=new w.ENGINE.Game({name:"Playback test",grid:Array(7).fill("............"),units:[
    {t:"BISON",o:0,x:0,y:3},{t:"POLAR",o:1,x:3,y:3},{t:"HADRIAN",o:0,x:0,y:0},
    {t:"CHARLIE",o:0,x:0,y:6},{t:"PELICAN",o:0,x:2,y:6},{t:"BISON",o:1,x:11,y:6}]},{seed:7});
  d.getElementById("map-title").textContent="PLAYBACK TEST";
  ui=new w.UI.GameUI(d.getElementById("game-canvas"),game,{hotseat:true});return {w:w,d:d,g:game};
}
document.getElementById("hover").onclick=function(){
  checks=0;document.getElementById("results").textContent="";
  try{
    var x=setup(),unit=x.g.units[0],before;
    ui.renderer.hoverHex={col:unit.col,row:unit.row};
    for(var rank of [0,1,2,8]){
      unit.exp=rank;ui.updateHoverInfo();
      var canvas=x.d.querySelector("#unit-hover .unit-card-icon"),pixels=canvas.getContext("2d").getImageData(0,0,32,32).data;
      if(before)check(pixels.some(function(v,i){return v!==before[i];}),"mini unit popup refreshes its icon stars at "+x.w.UNIT_VIEW.rankLabel(unit));
      before=pixels;
    }
    document.getElementById("status").textContent=checks+" checks passed";
  }catch(e){document.getElementById("status").textContent="FAIL: "+e.message;console.error(e);}
};
document.getElementById("run").onclick=async function(){
  this.disabled=true;checks=0;document.getElementById("results").innerHTML="";document.getElementById("status").textContent="Running…";
  try{
    var x=setup(),d=x.d,w=x.w,g=x.g;await wait(50);
    var canvas=d.getElementById("game-canvas"),baseline=bounds(canvas),camera=[ui.renderer.zoom,ui.renderer.originX,ui.renderer.originY].join();
    ui.openWarDock("<p>Short report</p>","<p>One statistic</p>");await wait(20);
    check(bounds(canvas)===baseline,"opening a report does not resize or move the board");
    ui.openWarDock("<p>Long report</p>",Array(100).fill("<p>Battle statistics</p>").join(""));ui.setDetailsOpen(true);await wait(30);
    check(bounds(canvas)===baseline&&[ui.renderer.zoom,ui.renderer.originX,ui.renderer.originY].join()===camera,"growing metadata and opening details preserve board bounds and camera");
    ui.setDetailsOpen(false);ui.closeWarDock();
    var unit=g.units[0];ui.selectUnit(unit);ui.tryMove(unit,2,3);
    check(ui.busy&&ui.renderer.motion&&unit.col===2,"movement locks commands while the engine has committed the destination");
    var save=JSON.stringify(ui.snapshotForSave()),rng=g.rng.getState(),visited=new Set();
    while(ui.busy){if(ui.renderer.motion)visited.add(ui.renderer.motion.from.col+","+ui.renderer.motion.from.row);await wait(15);}
    check(visited.has("0,3")&&visited.size>=2,"movement visibly traverses intermediate hexes ("+Array.from(visited).join(" → ")+")");
    check(JSON.stringify(ui.snapshotForSave())===save&&g.rng.getState()===rng,"animation leaves the committed save and RNG untouched");
    check(ui.mode==="moved"&&ui.pickTargets.length===1&&!Array.from(d.querySelectorAll("#action-menu button")).some(function(b){return b.textContent==="End";}),"a move flows directly into available attacks without an End choice");
    ui.onHexClick(3,3);await wait(30);
    check(!d.getElementById("battle-stage").classList.contains("hidden")&&d.getElementById("battle-stage").textContent.includes("Terrain"),"combat opens the opposing formations and battle stats");
    check(bounds(canvas)===baseline,"battle screen and casualty readout preserve the board viewport");
    var battleSnapshot=JSON.stringify(g.snapshot()),battleText=d.getElementById("battle-content").textContent;
    d.getElementById("btn-battle-pause").click();
    var approach=d.getElementById("battle-stage").style.getPropertyValue("--battle-approach");
    await wait(4500);
    check(ui.busy&&d.getElementById("btn-battle-pause").textContent==="Resume"&&d.getElementById("battle-content").textContent===battleText&&
      d.getElementById("battle-stage").style.getPropertyValue("--battle-approach")===approach,"Pause freezes the approach, casualties and automatic battle exit");
    check(JSON.stringify(g.snapshot())===battleSnapshot,"pausing never changes the committed battle, experience or RNG");
    d.getElementById("btn-battle-pause").click();
    for(var attempt=0;attempt<100&&d.getElementById("battle-stage").style.getPropertyValue("--battle-approach")===approach;attempt++)await wait(25);
    check(Number(d.getElementById("battle-stage").style.getPropertyValue("--battle-approach"))<Number(approach),"Resume continues the approach from its paused position");
    var phases=new Set(["ready",d.querySelector(".battle-screen").dataset.battlePhase]);
    while(ui.busy){phases.add(d.querySelector(".battle-screen").dataset.battlePhase);await wait(25);}
    check(["ready","fighting","result"].every(function(p){return phases.has(p);}),"live battles visibly pass through Ready, Fighting and Result");
    check(Array.from(d.querySelectorAll(".battle-machine canvas")).every(function(c){return c.dataset.exp==="0";})&&
      !!d.querySelector(".battle-heading [data-exp-glow-from]"),"only header icons gain glowing experience stars; formation models have no stars");
    check(d.getElementById("battle-content").textContent.includes("Experience gained")&&!d.getElementById("battle-content").textContent.includes("EXP "),"battle result shows earned stars on icons without numeric experience");
    check(d.getElementById("battle-stage").classList.contains("hidden")&&bounds(canvas)===baseline,"battle completes and returns to the same map viewport");
    var gun=g.units.find(function(u){return u.typeId==="HADRIAN";});ui.selectUnit(gun);ui.tryMove(gun,1,0);
    while(ui.busy)await wait(15);
    check(gun.moved&&ui.mode==="idle"&&!ui.selected,"move-or-fire unit finishes automatically after moving");
    var still=g.units.find(function(u){return u.typeId==="CHARLIE";});ui.selectUnit(still);ui.onHexClick(still.col,still.row);
    while(ui.busy)await wait(15);
    check(still.moved&&ui.mode==="idle"&&!ui.renderer.motion,"staying on the current hex completes once without leaving an animation active");
    ui.deselect();ui.watchAI=true;ui.renderer.zoom*=1.2;ui.renderer.panBy(25,-18);
    camera=[ui.renderer.zoom,ui.renderer.originX,ui.renderer.originY].join();
    ui.showWatchMove({t:"move",unit:g.units[1],from:{col:10,row:6},to:{col:11,row:6}});ui.draw();
    check([ui.renderer.zoom,ui.renderer.originX,ui.renderer.originY].join()===camera,"watched opponent selection preserves the chosen camera");
    ui.closeWarDock();
    // Inspect real hover canvases: data-exp alone cannot prove the stars were painted.
    var style=w.RENDER.getStyle(),iconSet=w.RENDER.getIconSet();
    try{
      for(var look of [["pixel","remake"],["pixel","legacy"],["classic","remake"],["neon","remake"]]){
        w.RENDER.setStyle(look[0]);w.RENDER.setIconSet(look[1]);
        ui.game=g;ui.renderer.game=g;ui.mode="idle";ui.renderer.hoverHex={col:unit.col,row:unit.row};
        var oldExp=unit.exp,hoverPixels=[];
        for(var rank of [0,1,2,8]){
          unit.exp=rank;ui.updateHoverInfo();
          var icon=d.querySelector("#unit-hover .unit-card-icon");
          hoverPixels.push(icon.getContext("2d").getImageData(0,0,32,32).data);
        }
        check(hoverPixels.slice(1).every(function(p,i){return p.some(function(v,k){return v!==hoverPixels[i][k];});}),
          look.join("/")+": mini unit hover paints and refreshes each star rank, including unchanged damage bonus tiers");
        unit.exp=oldExp;await wait(0);
        for(var owner of [-1,0,1]){
          ui.game=new w.ENGINE.Game({name:"Factory stars",grid:Array(7).fill("............").map(function(row,i){return i===3?"....F.......":row;}),
            buildings:[{col:4,row:3,owner:owner,stored:[{t:"BISON",exp:0},{t:"BISON",exp:3},{t:"BISON",exp:8}]}],
            units:[{t:"CHARLIE",o:0,x:0,y:0},{t:"BISON",o:1,x:11,y:6}]},{seed:7});
          ui.renderer.game=ui.game;ui.renderer.fitToMap();ui.mode="idle";ui.renderer.hoverHex={col:4,row:3};ui.updateHoverInfo();ui.showHexInfo(4,3);
          for(var id of ["unit-hover","hex-info"]){
            var icons=Array.from(d.getElementById(id).querySelectorAll("canvas[data-unit-type]"));
            var pixels=icons.map(function(c){return c.getContext("2d").getImageData(0,0,32,32).data;});
            check(icons.length===3&&pixels[1].some(function(value,i){return value!==pixels[0][i];})&&pixels[2].some(function(value,i){return value!==pixels[0][i];}),
              look.join("/")+" owner "+owner+" "+id+": rank stars and General are visible on the existing icons");
          }
          await wait(0);
        }
      }
    }finally{w.RENDER.setStyle(style);w.RENDER.setIconSet(iconSet);}
    ui.game=g;ui.renderer.game=g;ui.refreshStatus();ui.draw();
    document.getElementById("status").textContent=checks+" checks passed";
  }catch(error){document.getElementById("status").textContent="FAIL: "+error.message;console.error(error);}
  this.disabled=false;
};
</script></body></html>
