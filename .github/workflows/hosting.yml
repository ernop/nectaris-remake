name: Release to nectaris-remake.fuseki.net

# Every master commit that passes the Tests workflow is released; a manual run
# on master releases master's tip. Fuseki owns the server side:
# https://github.com/ernop/fuseki4_ai/blob/master/docs/minesweeper-friendly-hosting-plan.md
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuseki-hosting
  cancel-in-progress: false

jobs:
  deploy:
    # A fork's pull request can also be named master, so the triggering run must
    # be a push to this repository.
    if: >-
      github.ref == 'refs/heads/master' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production-fuseki
      url: https://nectaris-remake.fuseki.net/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Refuse an outdated revision
        run: |
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/master | cut -f1)"
      - name: Verify HTTPS before changing the release
        run: curl --fail --silent --show-error --max-time 30 https://nectaris-remake.fuseki.net/VERSION
      - name: Build committed runtime
        run: python3 deploy/build-release.py HEAD /tmp/nectaris-release.tar
      - name: Write dedicated deployment identity
        run: |
          umask 077
          python3 - <<'PY'
          from pathlib import Path
          key = ${{ toJSON(secrets.FUSEKI_DEPLOY_SSH_KEY) }}
          if not key.startswith('-----BEGIN OPENSSH PRIVATE KEY-----\n'):
              raise ValueError('FUSEKI_DEPLOY_SSH_KEY is missing or invalid')
          # OpenSSH rejects a key file without its final newline, which a
          # stored secret may lack.
          Path('/tmp/fuseki-deploy-key').write_text(key.rstrip('\n') + '\n')
          PY
          ssh-keygen -y -f /tmp/fuseki-deploy-key > /dev/null
      - name: Publish and verify exact revision
        run: python3 deploy/publish.py /tmp/nectaris-release.tar /tmp/fuseki-deploy-key deploy/known_hosts
      - name: Remove deployment identity
        if: always()
        run: rm -f /tmp/fuseki-deploy-key
