name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine-and-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rules, search, replays and all-map self-play
        run: node test/run-tests.js
      - name: Parallel tournament and checkpoint recovery
        run: node test/tournament-runner-tests.cjs
      - name: Rust simulator replays the behaviour lock and its bots decide alike
        working-directory: sim
        run: cargo run --release --locked -- replay && cargo run --release --locked -- decide --verify-caches
      - name: A Rust-played tournament passes the JavaScript import check
        working-directory: sim
        run: >-
          cargo run --release --locked -- tournament --out="$RUNNER_TEMP/rust-run"
          --opponents=classic,tactical,beam --boards=0,1 --rounds=2 --threads=2 &&
          node ../tools/sim/import-rust.cjs "$RUNNER_TEMP/rust-run"
